<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Halı Saha — Salı 21:00 senindir</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* YEŞİL PALET — saha/çim dünyası, BenelOil tabela dili */
    --paper: #f6faf2; --paper-2: #e9f2e2; --ink: #1e2f24; --muted: #6d8073;
    --line: rgba(30,47,36,.13); --edge: rgba(30,47,36,.28);
    --green: #2f9e57; --green-dark: #1f7a41; --green-deep: #14532d;
    --head: #2f3a42; --head-ink: #e8edf0;
    --lime: #8ec63f; --sun: #f2b53c; --clay: #e07a4a; --sky: #3aa6c9;
    --r-sm: 9px; --r-md: 12px; --r-lg: 14px;
    --shadow: 0 8px 22px rgba(20,60,35,.20);
    --font: "Baloo 2", -apple-system, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:var(--font); color:var(--ink);
    background:#a8dcef; user-select:none; -webkit-user-select:none; }
  canvas { display:block; position:fixed; inset:0; }
  button { font-family:var(--font); cursor:pointer; border:0; color:inherit; }

  /* ===== ÜST ŞERİT ===== */
  #hud { position:fixed; top:10px; left:10px; display:flex; flex-direction:row; gap:4px; z-index:10; }
  .chip { flex-direction:row !important; gap:6px; align-items:center !important; }
  .chip { background:var(--paper); border-radius:6px; padding:4px 10px; box-shadow:var(--shadow); white-space:nowrap;
    border-bottom:3px solid #dbe8d3; font-weight:700; font-size:13px;
    display:flex; line-height:1.1; }
  .chip small { color:var(--muted); font-weight:700; font-size:8.5px; text-transform:uppercase; letter-spacing:.5px; }
  .chip b { font-size:12.5px; color:var(--ink); }
  .chip:first-child b { color:var(--green-dark); }
  .chip.warn { border-bottom-color:#f0cdb8; }
  .chip.warn b { color:var(--clay); }

  /* ===== SOL: GELEN İSTEKLER (akan şerit) ===== */
  #queue { position:fixed; left:10px; top:52px; bottom:10px; width:196px; z-index:12;
    background:var(--paper); border-radius:var(--r-lg); box-shadow:var(--shadow);
    display:flex; flex-direction:column; overflow:hidden; }
  .desk-head { background:var(--head); color:var(--head-ink); font-size:9.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.8px; padding:5px 10px; text-align:center; position:relative;
    flex-shrink:0; }
  .desk-head.ringing { animation:ringpulse .5s ease-out 2; }
  @keyframes ringpulse { 0%{background:var(--head)} 35%{background:var(--sun);color:#3d2a06} 100%{background:var(--head)} }
  #qlist { padding:8px; display:flex; flex-direction:column; gap:7px; overflow-y:auto; flex:1;
    background:var(--paper-2); scrollbar-width:thin; scrollbar-color:#bcd4bb transparent; }
  #qlist::-webkit-scrollbar { width:6px; }
  #qlist::-webkit-scrollbar-track { background:transparent; }
  #qlist::-webkit-scrollbar-thumb { background:#bcd4bb; border-radius:99px; }
  #qlist::-webkit-scrollbar-thumb:hover { background:var(--green); }
  .rcard { background:#fff; border-radius:10px; padding:8px 9px; cursor:pointer;
    border:1.5px solid #e2ece0; transition:border-color .1s; position:relative; flex-shrink:0; }
  .rcard:hover { border-color:var(--green); }
  .rcard.sel { border-color:var(--green); background:#eefaf0; box-shadow:0 0 0 2px var(--green) inset; }
  .rcard.new { animation:slidein .38s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes slidein { from { transform:translateX(-115%); opacity:0 } to { transform:none; opacity:1 } }
  .rcard .team { font-weight:800; font-size:12px; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; padding-right:52px; }
  .rcard .when { font-size:12.5px; font-weight:800; color:var(--green-dark); }
  .rcard .meta { font-size:11px; color:var(--muted); font-weight:650; }
  .rcard .price { font-weight:800; font-size:13px; color:var(--ink); }
  .tagsub { position:absolute; top:8px; right:8px; background:var(--sun); color:#4a3208;
    font-size:9px; font-weight:800; padding:2px 7px; border-radius:99px; white-space:nowrap;
    letter-spacing:.2px; line-height:1.3; }
  .rcard .flex { background:var(--sky); color:#fff; font-size:8.5px; font-weight:800; padding:1px 5px;
    border-radius:99px; margin-left:5px; vertical-align:2px; letter-spacing:.3px; }
  .rcard .plab { font-size:9.5px; color:var(--muted); font-weight:750; text-transform:uppercase; letter-spacing:.4px; }
  .rcard .pw { font-size:10.5px; color:var(--muted); font-weight:700; }
  .hgl { display:flex; gap:5px; margin-top:7px; }
  .hgl button { flex:1; background:#fff; border-radius:7px; border:1.5px solid #d7e5d2;
    padding:3px 3px 3px; display:flex; flex-direction:column; align-items:center; line-height:1.15; }
  .hgl button b { font-size:11px; font-weight:800; color:var(--green-deep); }
  .hgl button i { font-size:8.5px; font-style:normal; font-weight:750; color:var(--muted); letter-spacing:.2px; }
  .hgl button:hover { background:#fffaf0; border-color:var(--sun); }
  .hgl button:hover b { color:#8a5a00; }
  .hgl button:last-child:hover { background:#fff4f0; border-color:var(--clay); }
  .hgl button:last-child:hover b { color:#b45c33; }
  .hgl button:last-child i { color:#c98a6a; }
  .hdone { margin-top:7px; font-size:10px; font-weight:750; color:var(--muted); text-align:center;
    background:var(--paper-2); border-radius:7px; padding:5px 0; }
  .hint2 { font-size:9.5px; font-weight:750; color:var(--muted); margin-top:5px; font-style:italic; }
  .hint2.up { color:var(--green-dark); } .hint2.dn { color:var(--clay); }
  .bar { height:3px; background:var(--line); border-radius:2px; margin-top:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--sun); }
  .rcard.deal .bar i { background:var(--green); }
  .rcard.deal { border-color:#bfdcc4; }
  .empty { padding:16px 10px; font-size:11.5px; color:var(--muted); font-weight:650; text-align:center; line-height:1.4; }

  /* ===== ALT MERKEZ: GÜN SEKMELİ ÇİZELGE ===== */
  #desk { position:fixed; left:50%; bottom:10px; transform:translateX(-50%); z-index:12;
    background:var(--paper); border-radius:var(--r-lg); box-shadow:var(--shadow);
    display:flex; flex-direction:column; overflow:hidden; max-width:96vw; }
  /* YERLEŞTİRME MODU: kart seçiliyken çizelge sahnenin yıldızı olur */
  #desk.picking { box-shadow:0 0 0 3px var(--sun), 0 10px 30px rgba(160,110,10,.35); }
  #desk.picking .desk-head { background:var(--sun); color:#3d2a06; }
  #pickbar { position:fixed; left:50%; transform:translateX(-50%); z-index:13; display:none;
    background:var(--sun); color:#3d2a06; font-weight:800; font-size:12.5px; padding:7px 9px 7px 16px;
    border-radius:99px; box-shadow:0 6px 18px rgba(160,110,10,.4); white-space:nowrap;
    letter-spacing:.2px; display:none; align-items:center; gap:9px; }
  #pickbar button { background:#2f3a42; color:#fff; font-weight:800; font-size:12px;
    padding:6px 13px; border-radius:99px; cursor:pointer; }
  #pickbar button:hover { background:#1f282e; }
  #pickbar.show { display:flex; animation:bounce 1s ease-in-out infinite; }
  #pickbar .arr { font-size:14px; margin-left:6px; }
  @keyframes bounce { 0%,100% { transform:translateX(-50%) translateY(0) } 50% { transform:translateX(-50%) translateY(7px) } }
  #daytabs { display:flex; gap:3px; padding:6px 8px 0; }
  .dtab { flex:1; min-width:48px; background:var(--paper-2); border:1.5px solid transparent; border-radius:9px;
    padding:5px 6px 6px; cursor:pointer; text-align:center; position:relative; transition:border-color .1s; }
  .dtab:hover { border-color:#bcd4bb; }
  .dtab.on { background:#fff; border-color:var(--green); box-shadow:0 0 0 1.5px var(--green) inset; }
  .dtab b { font-size:10.5px; font-weight:800; color:var(--ink); display:block; }
  .dtab.today b::after { content:'•'; color:var(--sun); margin-left:3px; }
  .dtab .obar { height:4px; background:var(--line); border-radius:3px; margin-top:4px; overflow:hidden; }
  .dtab .obar i { display:block; height:100%; background:var(--green); }
  .dtab .dot { position:absolute; top:5px; right:6px; width:9px; height:9px; border-radius:99px;
    background:var(--sun); box-shadow:0 0 6px rgba(242,181,60,.9); animation:pulse2 .7s infinite; }
  @keyframes pulse2 { 50% { transform:scale(1.45); } }
  #calwrap { padding:6px 8px 8px; }
  #cal { display:flex; gap:4px; }
  .dslot { width:42px; height:40px; border-radius:8px; background:var(--paper-2); border:1.5px solid transparent;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1px; transition:transform .08s, border-color .08s; overflow:hidden; }
  .dslot .h { font-size:8.5px; font-weight:800; color:var(--muted); line-height:1; }
  .dslot .t { font-size:9px; font-weight:800; color:var(--ink); line-height:1.1; max-width:38px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dslot:hover { transform:translateY(-2px); border-color:var(--green); }
  .dslot.prime { background:#f0e9d6; }
  .dslot.full { background:var(--green); }
  .dslot.full .h, .dslot.full .t { color:#fff; }
  .dslot.sub { background:var(--sun); }
  .dslot.sub .h, .dslot.sub .t { color:#4a3208; }
  .dslot.hint { background:#c9efd4; border:2px solid var(--sun); animation:pulse .7s infinite; }
  .dslot.best { background:var(--sun); border-color:#c98d1e; }
  .dslot.best .h, .dslot.best .t { color:#3d2a06; }
  .dslot.best::after { content:'ÖNERİ'; font-size:6.5px; font-weight:800; color:#3d2a06; letter-spacing:.5px; }
  .dslot.now { box-shadow:0 0 0 2px var(--sky); }
  @keyframes pulse { 50% { background:var(--lime); transform:scale(1.12); box-shadow:0 0 14px rgba(242,181,60,.75); } }

  /* ===== SAĞ RAY: HEDEFLER ===== */
  #goals { background:var(--paper); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:8px; }
  #goals .gh { background:var(--head); color:var(--head-ink); font-size:11px; font-weight:800; padding:6px 11px;
    text-transform:uppercase; letter-spacing:.6px; display:flex; justify-content:space-between; }
  #goals .gb { padding:9px 11px 10px; }
  .goal { margin-bottom:9px; }
  .goal:last-child { margin-bottom:0; }
  .goal .gl { display:flex; justify-content:space-between; font-size:12px; font-weight:750; align-items:baseline; }
  .goal .gv { color:var(--muted); font-weight:800; font-size:11px; }
  .goal.ok .gl { color:var(--green-dark); }
  .gbar { height:6px; background:#e2ece0; border-radius:99px; margin-top:4px; overflow:hidden; }
  .gbar i { display:block; height:100%; background:linear-gradient(90deg,var(--lime),var(--green)); border-radius:99px; transition:width .3s; }
  .goal.ok .gbar i { background:var(--green); }
  .grew { font-size:10.5px; color:var(--sun); font-weight:800; }
  .mstone { border-top:1.5px solid #e6efe3; margin-top:9px; padding-top:8px; }
  .mstone .ml { font-size:11.5px; font-weight:800; }
  .mstone .mv { font-size:10.5px; color:var(--muted); font-weight:700; }

  /* ===== SAĞ: ÖNERİ (tabela kartı) ===== */
  #rail { position:fixed; right:10px; top:10px; width:212px; z-index:10; }
  #tips { display:flex; flex-direction:column; gap:8px; }
  .tip { background:var(--paper); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  .tip .th { background:var(--head); color:var(--head-ink); font-size:11px; font-weight:800; padding:5px 11px;
    text-transform:uppercase; letter-spacing:.6px; }
  
  .tip.urgent .th { background:var(--clay); }
  .tip .tb { padding:9px 11px; }
  .tip .tt { font-weight:800; font-size:13.5px; line-height:1.2; }
  .tip .tw { font-size:11.5px; color:var(--muted); font-weight:650; margin:3px 0 8px; line-height:1.4; }
  .tip button { background:var(--green); color:#fff; font-weight:800; font-size:12px; padding:8px 10px;
    border-radius:9px; width:100%; border-bottom:3px solid var(--green-dark); }
  .tip.urgent button { background:var(--clay); border-bottom-color:#b45c33; }
  .tip button:hover { filter:brightness(1.07); }

  /* ===== OFİS ===== */
  #zoombar { position:fixed; left:14px; bottom:14px; z-index:13; display:flex; flex-direction:column; gap:5px; }
  #zoombar button { width:38px; height:34px; background:var(--paper); color:var(--head); font-size:19px;
    font-weight:800; border-radius:10px; box-shadow:var(--shadow); border:1.5px solid #dde9d5; line-height:1; }
  #zoombar button:hover { background:#fff; border-color:var(--green); }
  #sfxbtn { position:fixed; right:14px; bottom:74px; z-index:13; background:var(--paper); color:var(--head);
    font-weight:800; font-size:11.5px; padding:8px 14px; border-radius:11px; box-shadow:var(--shadow);
    border:1.5px solid #dde9d5; letter-spacing:.5px; }
  #sfxbtn.off { color:#a8b3a6; }
  #officebtn { position:fixed; right:14px; bottom:14px; z-index:13; background:var(--green);
    color:#fff; font-weight:800; font-size:15px; padding:14px 26px; border-radius:var(--r-lg);
    border-bottom:3px solid var(--green-dark); box-shadow:var(--shadow); letter-spacing:.5px; }
  #officebtn:hover { filter:brightness(1.07); }
  #office { position:fixed; inset:0; z-index:40; background:rgba(20,45,30,.52); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:20px; }
  #office.show { display:flex; }
  .panel { background:var(--paper); border-radius:22px; width:min(680px,100%); max-height:86vh; overflow:auto;
    box-shadow:0 24px 70px rgba(0,0,0,.42); }
  .phead { background:var(--head); color:var(--head-ink); padding:15px 22px; display:flex;
    justify-content:space-between; align-items:center; position:sticky; top:0; z-index:2; }
  .phead b { font-size:19px; letter-spacing:.5px; }
  .phead button { background:var(--paper); color:var(--green-deep); font-weight:800; border-radius:10px; padding:6px 13px; font-size:13px; }
  .tabs { display:flex; gap:5px; padding:11px 15px 0; background:var(--paper-2); }
  .tab { flex:1; background:transparent; border-radius:11px 11px 0 0; padding:9px; font-weight:800; font-size:13px; color:var(--muted); }
  .tab.on { background:var(--paper); color:var(--green-deep); }
  .pbody { padding:15px 17px 22px; }
  .srow { display:flex; align-items:center; gap:10px; padding:11px 12px; background:#fff; border-radius:12px;
    margin-bottom:9px; border:1.5px solid #e6efe3; flex-wrap:wrap; }
  .srow .nm { font-weight:800; font-size:14.5px; flex:1 0 auto; }
  .srow .gn { font-size:11.5px; font-weight:800; color:var(--green-dark); background:#dff2e4; padding:3px 9px; border-radius:99px; }
  .srow .ds { flex:1 0 100%; font-size:11.5px; color:var(--muted); font-weight:650; line-height:1.4; }
  .srow .up { font-size:11px; color:var(--clay); font-weight:800; }
  .buy { background:var(--green); color:#fff; font-weight:800; font-size:13px; padding:9px 15px; border-radius:10px;
    border-bottom:3px solid var(--green-dark); white-space:nowrap; }
  .buy[disabled] { background:#cfd6cd; border-bottom-color:#b3bdb1; cursor:default; }
  .buy.have { background:var(--paper-2); color:var(--muted); border-bottom-color:var(--line); }

  /* ===== ARSA PANELİ ===== */
  #parcel { position:fixed; left:50%; top:12%; transform:translateX(-50%); z-index:41; width:min(520px,92vw);
    background:var(--paper); border-radius:16px; box-shadow:0 22px 60px rgba(0,0,0,.4); overflow:hidden; display:none; }
  #parcel.show { display:block; }
  #parcel .phead { background:var(--head); color:var(--head-ink); padding:12px 18px; display:flex;
    justify-content:space-between; align-items:center; }
  #parcel .phead b { font-size:16px; letter-spacing:.5px; }
  #parcel .phead button { background:var(--paper); color:var(--green-deep); font-weight:800; border-radius:9px; padding:5px 12px; font-size:12px; }
  #parcel .pbody { padding:13px 15px 17px; max-height:60vh; overflow:auto; }

  /* ===== TOAST ===== */
  #toasts { position:fixed; left:50%; transform:translateX(-50%); top:76px; z-index:50;
    display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; }
  .toast { background:var(--green-deep); color:#eaf6ec; font-weight:800; font-size:13.5px; padding:10px 20px;
    border-radius:99px; box-shadow:var(--shadow); animation:pop .22s; }
  .toast.g { background:var(--green); } .toast.b { background:var(--clay); }
  @keyframes pop { from { transform:translateY(-8px); opacity:0 } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="chip"><small>Kasa</small><b id="h-money">₺25.000</b></div>
  <div class="chip"><small>Gün</small><b id="h-day">1</b></div>
  <div class="chip"><small>Saat</small><b id="h-clock">09:00</b></div>
  <div class="chip"><small>İtibar</small><b id="h-rep">3.0</b></div>
  <div class="chip"><small>Doluluk</small><b id="h-occ">%0</b></div>
  <div class="chip"><small>Kira</small><b id="h-rent">₺12.000 · 7g</b></div>
</div>

<div id="rail"><div id="goals"></div><div id="tips"></div></div>

<div id="pickbar"></div>

<div id="queue">
  <div class="desk-head">Gelen İstekler</div>
  <div id="qlist"></div>
</div>

<div id="desk">
  <div class="desk-head">Çizelge — boş saate tıkla</div>
  <div id="daytabs"></div>
  <div id="calwrap"><div id="cal"></div></div>
</div>

<div id="zoombar"><button id="zin">+</button><button id="zout">−</button></div>
<button id="sfxbtn" title="Ses aç/kapa">SES</button>
<button id="officebtn">OFİS</button>

<div id="office">
  <div class="panel">
    <div class="phead"><b>OFİS</b><button id="closeoffice">Kapat ✕</button></div>
    <div class="tabs">
      <button class="tab on" data-tab="yatirim">Yatırım</button>
      <button class="tab" data-tab="ozet">Özet</button>
      <button class="tab" data-tab="defter">Defter</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>

<div id="parcel"></div>
<div id="toasts"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
