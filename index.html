<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Halı Saha — Salı 21:00 senindir</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* YEŞİL PALET — saha/çim dünyası, BenelOil tabela dili */
    --paper: #f6faf2; --paper-2: #e9f2e2; --ink: #1e2f24; --muted: #6d8073;
    --line: rgba(30,47,36,.13); --edge: rgba(30,47,36,.28);
    --green: #2f9e57; --green-dark: #1f7a41; --green-deep: #14532d;
    --lime: #8ec63f; --sun: #f2b53c; --clay: #e07a4a; --sky: #3aa6c9;
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
    --shadow: 0 8px 22px rgba(20,60,35,.20);
    --font: "Baloo 2", -apple-system, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:var(--font); color:var(--ink);
    background:#a8dcef; user-select:none; -webkit-user-select:none; }
  canvas { display:block; position:fixed; inset:0; }
  button { font-family:var(--font); cursor:pointer; border:0; color:inherit; }

  /* ===== ÜST ŞERİT ===== */
  #hud { position:fixed; top:14px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:10; }
  .chip { background:var(--paper); border-radius:var(--r-md); padding:7px 15px; box-shadow:var(--shadow);
    border-bottom:3px solid var(--green-dark); font-weight:700; font-size:13px;
    display:flex; flex-direction:column; align-items:center; line-height:1.1; min-width:74px; }
  .chip small { color:var(--muted); font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.6px; }
  .chip b { font-size:16px; color:var(--green-deep); }
  .chip.warn { border-bottom-color:var(--clay); }
  .chip.warn b { color:var(--clay); }

  /* ===== ALT MERKEZ: REZERVASYON MASASI (kart + takvim BİTİŞİK) ===== */
  #desk { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:12;
    background:var(--paper); border-radius:var(--r-lg); box-shadow:var(--shadow);
    border-bottom:5px solid var(--green-dark); display:flex; overflow:hidden; max-width:96vw; }
  .desk-head { background:var(--green-deep); color:#eaf6ec; font-size:10.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.9px; padding:6px 12px; text-align:center; }

  /* sol sütun: gelen istekler */
  #qcol { width:206px; background:var(--paper-2); display:flex; flex-direction:column; }
  #qlist { padding:8px; display:flex; flex-direction:column; gap:7px; overflow-y:auto; max-height:216px; }
  .rcard { background:#fff; border-radius:var(--r-md); padding:9px 10px; cursor:pointer;
    border-bottom:3px solid var(--edge); transition:transform .1s, border-color .1s; }
  .rcard:hover { transform:translateY(-2px); border-bottom-color:var(--green); }
  .rcard.sel { border-bottom-color:var(--green); background:#eefaf0; box-shadow:0 0 0 2px var(--green) inset; }
  .rcard .team { font-weight:800; font-size:13.5px; display:flex; justify-content:space-between; align-items:center; }
  .rcard .when { font-size:14px; font-weight:800; color:var(--green-dark); }
  .rcard .meta { font-size:11px; color:var(--muted); font-weight:650; }
  .rcard .price { font-weight:800; font-size:15px; color:var(--ink); }
  .tagsub { background:var(--sun); color:#4a3208; font-size:9.5px; font-weight:800; padding:1px 6px; border-radius:99px; }
  .bar { height:3px; background:var(--line); border-radius:2px; margin-top:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--sun); }
  .empty { padding:16px 10px; font-size:11.5px; color:var(--muted); font-weight:650; text-align:center; line-height:1.4; }

  /* sağ sütun: takvim */
  #calcol { display:flex; flex-direction:column; }
  #calwrap { padding:8px 10px 10px; }
  #cal table { border-collapse:separate; border-spacing:3px; }
  #cal th { font-size:10.5px; color:var(--muted); font-weight:800; padding:0 2px; }
  #cal th.dayh { text-align:right; padding-right:5px; width:26px; }
  .slot { width:31px; height:24px; border-radius:6px; background:var(--paper-2); border:1.5px solid transparent;
    font-size:9.5px; font-weight:800; color:var(--muted); display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden; transition:transform .08s; }
  .slot:hover { transform:scale(1.12); border-color:var(--green); }
  .slot.full { background:var(--green); color:#fff; }
  .slot.sub { background:var(--sun); color:#4a3208; }
  .slot.hint { background:#c9efd4; border-color:var(--green); animation:pulse .85s infinite; }
  .slot.now { box-shadow:0 0 0 2px var(--sky); }
  .slot.prime { background:#dcebd4; }
  @keyframes pulse { 50% { background:var(--lime); transform:scale(1.1); } }

  /* ===== SAĞ: GÖREV/ÖNERİ (border-left YOK — tabela kartı) ===== */
  #tips { position:fixed; right:14px; top:14px; width:246px; z-index:10; display:flex; flex-direction:column; gap:8px; }
  .tip { background:var(--paper); border-radius:var(--r-md); box-shadow:var(--shadow); overflow:hidden;
    border-bottom:4px solid var(--green-dark); }
  .tip .th { background:var(--green); color:#fff; font-size:11px; font-weight:800; padding:5px 11px;
    text-transform:uppercase; letter-spacing:.6px; }
  .tip.urgent { border-bottom-color:var(--clay); }
  .tip.urgent .th { background:var(--clay); }
  .tip .tb { padding:9px 11px; }
  .tip .tt { font-weight:800; font-size:13.5px; line-height:1.2; }
  .tip .tw { font-size:11.5px; color:var(--muted); font-weight:650; margin:3px 0 8px; line-height:1.4; }
  .tip button { background:var(--green); color:#fff; font-weight:800; font-size:12px; padding:8px 10px;
    border-radius:9px; width:100%; border-bottom:3px solid var(--green-dark); }
  .tip.urgent button { background:var(--clay); border-bottom-color:#b45c33; }
  .tip button:hover { filter:brightness(1.07); }

  /* ===== OFİS ===== */
  #officebtn { position:fixed; right:14px; bottom:14px; z-index:13; background:var(--green);
    color:#fff; font-weight:800; font-size:15px; padding:14px 26px; border-radius:var(--r-lg);
    border-bottom:5px solid var(--green-dark); box-shadow:var(--shadow); letter-spacing:.5px; }
  #officebtn:hover { filter:brightness(1.07); }
  #office { position:fixed; inset:0; z-index:40; background:rgba(20,45,30,.52); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:20px; }
  #office.show { display:flex; }
  .panel { background:var(--paper); border-radius:22px; width:min(680px,100%); max-height:86vh; overflow:auto;
    box-shadow:0 24px 70px rgba(0,0,0,.42); border-bottom:6px solid var(--green-dark); }
  .phead { background:var(--green-deep); color:#eaf6ec; padding:15px 22px; display:flex;
    justify-content:space-between; align-items:center; position:sticky; top:0; z-index:2; }
  .phead b { font-size:19px; letter-spacing:.5px; }
  .phead button { background:var(--paper); color:var(--green-deep); font-weight:800; border-radius:10px; padding:6px 13px; font-size:13px; }
  .tabs { display:flex; gap:5px; padding:11px 15px 0; background:var(--paper-2); }
  .tab { flex:1; background:transparent; border-radius:11px 11px 0 0; padding:9px; font-weight:800; font-size:13px; color:var(--muted); }
  .tab.on { background:var(--paper); color:var(--green-deep); }
  .pbody { padding:15px 17px 22px; }
  .srow { display:flex; align-items:center; gap:10px; padding:11px 12px; background:#fff; border-radius:var(--r-md);
    margin-bottom:9px; border-bottom:3px solid var(--line); flex-wrap:wrap; }
  .srow .nm { font-weight:800; font-size:14.5px; flex:1 0 auto; }
  .srow .gn { font-size:11.5px; font-weight:800; color:var(--green-dark); background:#dff2e4; padding:3px 9px; border-radius:99px; }
  .srow .ds { flex:1 0 100%; font-size:11.5px; color:var(--muted); font-weight:650; line-height:1.4; }
  .srow .up { font-size:11px; color:var(--clay); font-weight:800; }
  .buy { background:var(--green); color:#fff; font-weight:800; font-size:13px; padding:9px 15px; border-radius:10px;
    border-bottom:3px solid var(--green-dark); white-space:nowrap; }
  .buy[disabled] { background:#cfd6cd; border-bottom-color:#b3bdb1; cursor:default; }
  .buy.have { background:var(--paper-2); color:var(--muted); border-bottom-color:var(--line); }

  /* ===== TOAST ===== */
  #toasts { position:fixed; left:50%; transform:translateX(-50%); top:76px; z-index:50;
    display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; }
  .toast { background:var(--green-deep); color:#eaf6ec; font-weight:800; font-size:13.5px; padding:10px 20px;
    border-radius:99px; box-shadow:var(--shadow); animation:pop .22s; }
  .toast.g { background:var(--green); } .toast.b { background:var(--clay); }
  @keyframes pop { from { transform:translateY(-8px); opacity:0 } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="chip"><small>Kasa</small><b id="h-money">₺25.000</b></div>
  <div class="chip"><small>Gün</small><b id="h-day">1</b></div>
  <div class="chip"><small>Saat</small><b id="h-clock">09:00</b></div>
  <div class="chip"><small>İtibar</small><b id="h-rep">3.0</b></div>
  <div class="chip"><small>Doluluk</small><b id="h-occ">%0</b></div>
</div>

<div id="tips"></div>

<div id="desk">
  <div id="qcol">
    <div class="desk-head">Gelen İstekler</div>
    <div id="qlist"></div>
  </div>
  <div id="calcol">
    <div class="desk-head">Haftalık Çizelge — boş saate tıkla</div>
    <div id="calwrap"><div id="cal"></div></div>
  </div>
</div>

<button id="officebtn">OFİS</button>

<div id="office">
  <div class="panel">
    <div class="phead"><b>OFİS</b><button id="closeoffice">Kapat ✕</button></div>
    <div class="tabs">
      <button class="tab on" data-tab="yatirim">Yatırım</button>
      <button class="tab" data-tab="ozet">Özet</button>
      <button class="tab" data-tab="defter">Defter</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>

<div id="toasts"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
